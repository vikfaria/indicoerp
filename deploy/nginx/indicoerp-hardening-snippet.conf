# Reduce log noise for trivial static probes.
location = /favicon.ico {
    access_log off;
    log_not_found off;
    expires 7d;
}

location = /robots.txt {
    access_log off;
    log_not_found off;
}

# Block dotfiles and VCS metadata except ACME challenge paths.
location ~ /\.(?!well-known).* {
    return 404;
}

# Block direct access to sensitive project files commonly probed by bots.
location ~* ^/(?:\.env(?:\..*)?|\.git(?:/.*)?|composer\.(?:json|lock)|package(?:-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|phpunit\.xml(?:\.dist)?|docker-compose\.ya?ml|vite\.config\.(?:js|ts)|artisan)$ {
    return 404;
}

# Block direct access to framework internals and log files.
location ~* ^/(?:bootstrap|config|database|resources|routes)/ {
    return 404;
}

location ~* ^/storage/logs/ {
    return 404;
}

# Block common dump and backup artefacts.
location ~* ^/.*\.(?:sql|bak|old|orig|save|swp|dist)$ {
    return 404;
}
