name: SCE Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  sce-test-suite:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sysgest_test
          MYSQL_USER: sysgest
          MYSQL_PASSWORD: sysgest
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: testing
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sysgest_test
      DB_USERNAME: sysgest
      DB_PASSWORD: sysgest
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SAFT_MZ_REQUIRE_XSD_VALIDATION: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, pdo, pdo_mysql, sqlite3
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          php -r '
          $ok = false;
          $host = getenv("DB_HOST");
          $port = getenv("DB_PORT");
          $db = getenv("DB_DATABASE");
          $user = getenv("DB_USERNAME");
          $pass = getenv("DB_PASSWORD");
          for ($i = 0; $i < 30; $i++) {
              try {
                  $pdo = new PDO(
                      "mysql:host={$host};port={$port};dbname={$db}",
                      $user,
                      $pass
                  );
                  $ok = true;
                  break;
              } catch (Throwable $e) {
                  echo "Waiting for MySQL...\n";
                  sleep(2);
              }
          }
          if (!$ok) {
              fwrite(STDERR, "MySQL service not ready.\n");
              exit(1);
          }'

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run SCE test suite
        run: |
          php artisan test \
            tests/Feature/CompanyFiscalSettingsTest.php \
            tests/Feature/FiscalDocumentComplianceTest.php \
            tests/Feature/MozambiqueAccountingFiscalMapTest.php \
            tests/Feature/MozambiqueGoLiveReadinessTest.php \
            tests/Feature/PosFiscalComplianceTest.php \
            tests/Feature/MozambiquePayrollTaxServiceTest.php
